name: Windows Smoke

on:
  push:
    # Temporary: also tip of P0 gate branch so Windows EXE smoke can run
    # without ManagePullRequest / workflow_dispatch (both blocked in agent env).
    branches:
      - main
      - cursor/p0-profile-cv-dialogs-d85b
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt-smoke:
    name: qt-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-runtime.txt -r requirements.txt
      - name: Offscreen Qt MainWindow smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_qt_smoke.py tests/test_pause_resume.py
      - name: Summary
        if: always()
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY "## QT SMOKE`nSee job result"

  build-and-exe-smoke:
    name: build-and-exe-smoke
    runs-on: windows-latest
    needs: [qt-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Runner CPU
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cpus = @(Get-CimInstance Win32_Processor)
          $name = ($cpus | Select-Object -First 1).Name
          $logical = ($cpus | Measure-Object NumberOfLogicalProcessors -Sum).Sum
          $physical = ($cpus | Measure-Object NumberOfCores -Sum).Sum
          Write-Host "runner_cpu name=$name logical=$logical physical=$physical"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-runtime.txt -r requirements-runtime.txt
          pip install -c constraints-runtime.txt -r requirements-dev.txt
      - name: Privacy scan
        run: python scripts/privacy_scan.py
      - name: Privacy allowlist regression
        run: python -m pytest -q tests/test_privacy_scan.py
      - name: Cache bundled CV model weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kk-cv-model-cache
          key: kk-cv-gguf-${{ hashFiles('core/cv_llm_runtime.py') }}
          restore-keys: |
            kk-cv-gguf-
      - name: Prepare bundled CV model (offline import)
        shell: pwsh
        env:
          # Optional: official Qwen repo when gated; unsloth mirror is the public fallback.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          # Cache GGUF between runs when possible; never commit weights.
          $cache = Join-Path $env:RUNNER_TEMP "kk-cv-model-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $env:KARRIEREKRAKE_MODELS_DIR = $cache
          python scripts/prepare_bundled_cv_model.py --allow-download
          if ($LASTEXITCODE -ne 0) { throw "prepare_bundled_cv_model failed" }
          $gguf = "vendor/cv_model/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf"
          if (!(Test-Path $gguf)) { throw "bundled GGUF missing after prepare" }
          $len = (Get-Item $gguf).Length
          if ($len -lt 1000000000) { throw "bundled GGUF too small: $len" }
          Write-Host "bundled_model_bytes=$len"
      - name: Build onefile EXE (model + llama_cpp runtime bundled)
        env:
          KARRIEREKRAKE_REQUIRE_BUNDLED_CV_MODEL: "1"
          KARRIEREKRAKE_EMBED_CV_MODEL_IN_EXE: "1"
          KARRIEREKRAKE_MODELS_DIR: ${{ runner.temp }}/kk-cv-model-cache
        run: |
          python -m PyInstaller --noconfirm --clean packaging/Karrierekrake.spec
          if (!(Test-Path "dist\Karrierekrake.exe")) { Write-Error "EXE missing"; exit 1 }
          $item = Get-Item "dist\Karrierekrake.exe"
          if ($item.Length -lt 1000000) { Write-Error "EXE too small: $($item.Length)"; exit 1 }
          $hash = (Get-FileHash "dist\Karrierekrake.exe" -Algorithm SHA256).Hash
          @"
          commit=$env:GITHUB_SHA
          size=$($item.Length)
          sha256=$hash
          python=3.12
          console=false
          cv_model_embedded=1
          "@ | Set-Content dist\build_metadata.txt
          Get-Content dist\build_metadata.txt
          # Fail if this is a console subsystem EXE (users must not see a terminal).
          $stream = [System.IO.File]::OpenRead("dist\Karrierekrake.exe")
          try {
            $bytes = [byte[]]::new(4096)
            $read = $stream.Read($bytes, 0, $bytes.Length)
            if ($read -lt 256) { throw "EXE header truncated" }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($pe -lt 0 -or $pe + 0x5E -gt $read) { throw "Invalid PE header offset" }
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          } finally { $stream.Dispose() }
          # 2 = WINDOWS_GUI, 3 = WINDOWS_CUI
          if ($subsystem -ne 2) { Write-Error "EXE subsystem=$subsystem (expected 2=WINDOWS_GUI / noconsole)"; exit 1 }
          Write-Host "EXE subsystem=WINDOWS_GUI (noconsole) OK"
        shell: pwsh
      - name: EXE reads physical cores via psutil
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Windowed onefile: stdout is not the log. Poll the report file.
          $out = Join-Path $env:RUNNER_TEMP "kk-physical-cores.txt"
          if (Test-Path $out) { Remove-Item $out -Force }
          $exe = (Resolve-Path "dist\Karrierekrake.exe").Path
          Start-Process -FilePath $exe -ArgumentList @("--report-physical-cores", $out) -WindowStyle Hidden | Out-Null
          $deadline = (Get-Date).AddSeconds(180)
          $line = ""
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $out) {
              $raw = Get-Content $out -Raw -ErrorAction SilentlyContinue
              if ($raw -and $raw.Trim()) { $line = $raw.Trim(); break }
            }
            Start-Sleep -Milliseconds 400
          }
          Get-Process -Name "Karrierekrake" -ErrorAction SilentlyContinue | ForEach-Object {
            try { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue } catch {}
          }
          if (-not $line) { Write-Error "EXE physical-cores report missing"; exit 1 }
          Write-Host $line
          $cores = @($line -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -like "physical_cores *" } | Select-Object -First 1)
          $threads = @($line -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -like "n_threads=*" } | Select-Object -First 1)
          if (-not $cores -or $cores -notmatch '^physical_cores source=psutil count=[1-9][0-9]*$') {
            Write-Error "EXE did not read physical cores via psutil (fallback or empty): $line"
            exit 1
          }
          if (-not $threads -or $threads -notmatch '^n_threads=[1-9][0-9]* n_threads_batch=[1-9][0-9]* physical=[1-9][0-9]* logical=[1-9][0-9]* reserve=[01]$') {
            Write-Error "EXE thread reserve line missing: $line"
            exit 1
          }
      - name: EXE llama load log (CPU features and backend variant)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # No GGUF on the runner, so this step cannot allocate CPU_REPACK/AMX
          # buffers. It still loads the bundled llama DLL and writes which
          # ggml-cpu library the EXE ships, plus the CPU-feature line of the
          # runner (not the i3). Buffer names are logged by the import as
          # cv_llm_load when a model is loaded. llama_model_buffer=not_loaded
          # is the expected line here.
          $out = Join-Path $env:RUNNER_TEMP "kk-llm-load.txt"
          if (Test-Path $out) { Remove-Item $out -Force }
          $exe = (Resolve-Path "dist\Karrierekrake.exe").Path
          Start-Process -FilePath $exe -ArgumentList @("--report-llm-load", $out) -WindowStyle Hidden | Out-Null
          $deadline = (Get-Date).AddSeconds(180)
          $text = ""
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $out) {
              $raw = Get-Content $out -Raw -ErrorAction SilentlyContinue
              if ($raw -and $raw.Trim()) { $text = $raw.Trim(); break }
            }
            Start-Sleep -Milliseconds 400
          }
          Get-Process -Name "Karrierekrake" -ErrorAction SilentlyContinue | ForEach-Object {
            try { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue } catch {}
          }
          if (-not $text) { Write-Error "EXE llama load report missing"; exit 1 }
          Write-Host $text
          if ($text -notmatch 'llama_cpu_features=.*AVX2 = 1') {
            Write-Error "EXE llama build did not report AVX2: $text"
            exit 1
          }
          if ($text -match 'AMX_INT8 = 1' -or $text -match 'AVX512 = 1') {
            Write-Error "EXE llama build has native AVX512/AMX kernels: $text"
            exit 1
          }
          if ($text -notmatch 'llama_cpu_all_variants=0') {
            Write-Error "EXE llama build is not a single fixed CPU library: $text"
            exit 1
          }
          if ($text -notmatch 'llama_runtime_isa=fixed') {
            Write-Error "EXE llama build reports runtime CPU selection: $text"
            exit 1
          }
          if ($text -notmatch 'llama_backend_libs=.*ggml-cpu') {
            Write-Error "EXE did not list a bundled ggml-cpu library: $text"
            exit 1
          }
          if ($text -match 'ggml-cpu-haswell|ggml-cpu-sapphirerapids|ggml-cpu-skylakex|ggml-cpu-icelake') {
            Write-Error "EXE ships GGML_CPU_ALL_VARIANTS libraries: $text"
            exit 1
          }
          if ($text -notmatch 'llama_model_buffer=not_loaded') {
            Write-Error "EXE load report did not state that no model buffer was allocated: $text"
            exit 1
          }
      - name: Production content scan + manifest
        shell: pwsh
        run: |
          python scripts/generate_content_manifest.py --exe dist/Karrierekrake.exe --out dist/content_manifest.json
          python scripts/scan_release_artifact.py --exe dist/Karrierekrake.exe --dist dist --manifest-out dist/content_manifest.json --fail-on-empty --require-cv-model-embedded
          if ($LASTEXITCODE -ne 0) { Write-Error "Production content gate FAILED"; exit 1 }
          Get-Content dist/content_manifest.json | Select-Object -First 40
      - name: Package Windows release zip (standalone EXE)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $install = Join-Path $env:RUNNER_TEMP "kk-install-$([guid]::NewGuid())"
          python scripts/package_windows_release.py `
            --dist dist `
            --out dist/Karrierekrake-Windows.zip `
            --stage-install $install
          if ($LASTEXITCODE -ne 0) { Write-Error "package_windows_release FAILED"; exit 1 }
          if (!(Test-Path "$install\Karrierekrake.exe")) { Write-Error "staged EXE missing"; exit 1 }
          "INSTALL_DIR=$install" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Staged install: $install"
      - name: Packaged EXE smoke-test (isolated LOCALAPPDATA)
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\jhs-smoke-$([guid]::NewGuid())"
          $env:QT_QPA_PLATFORM = "offscreen"
          # Windowed onefile: poll tokenized marker (do not trust process exit alone).
          & ".\scripts\ci_wait_exe_smoke.ps1" -ExePath (Resolve-Path "dist\Karrierekrake.exe") -LocalAppData $tmp.FullName
      - name: Packaged CV-import child while instance lock held
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:QT_QPA_PLATFORM = "offscreen"
          # Simulates: App already open → supervisor spawns second EXE as worker.
          # Without --cv-import-child routing the child hits the lock and never writes --out.
          python scripts/ci_cv_import_child_exe_check.py --exe dist/Karrierekrake.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "CV-import child EXE check FAILED"; exit 1 }
      - name: Offline CV import + cover letter acceptance (release gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONUTF8 = "1"
          # Shipped defaults only. Any set KARRIEREKRAKE_CV_ or KARRIEREKRAKE_LLM_
          # variable fails. Allowlist is empty: PEAK_RSS_BYTES_MAX would hide a
          # real PeakJobMemoryUsed breach, and LLM_BASE is set later inside the
          # e2e child only.
          python scripts/ci_release_env_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_release_env_gate.py --self-test
          if ($LASTEXITCODE -ne 0) { Write-Error "Release env self-test failed"; exit 1 }
          # Fresh LOCALAPPDATA, no model env overrides — must use embedded GGUF.
          Remove-Item Env:KARRIEREKRAKE_CV_LLM_MODEL -ErrorAction SilentlyContinue
          Remove-Item Env:KARRIEREKRAKE_MODELS_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:HTTP_PROXY,Env:HTTPS_PROXY,Env:http_proxy,Env:https_proxy -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Run from staged install dir (simulates zip extract), not the build dist tree.
          $exe = Join-Path $env:INSTALL_DIR "Karrierekrake.exe"
          if (!(Test-Path $exe)) { Write-Error "INSTALL_DIR EXE missing: $exe"; exit 1 }
          python scripts/ci_cv_import_exe_offline_e2e.py `
            --exe $exe `
            --cv tests/fixtures/cv_corpus/DE_01_Klassisch.pdf `
            --cv-en tests/fixtures/cv_corpus/EN_01_Classic_Resume.pdf `
            --out artifacts/cv_import_exe_offline_e2e.json `
            --import-timeout 900
          $code = $LASTEXITCODE
          if (Test-Path artifacts/cv_import_exe_offline_e2e.json) {
            Get-Content artifacts/cv_import_exe_offline_e2e.json
          }
          if ($code -ne 0) {
            Write-Host "Offline CV import EXE acceptance FAILED — release blocked"
            exit $code
          }
      - name: Packaged legacy DB migration (library + EXE smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\jhs-legacy-$([guid]::NewGuid())"
          $app = Join-Path $tmp.FullName "Karrierekrake"
          $data = Join-Path $app "data"
          New-Item -ItemType Directory -Force -Path $data, (Join-Path $app "logs"), (Join-Path $app "config") | Out-Null
          python -c @"
          from pathlib import Path
          from tests.test_db_migration_run_id import _make_legacy_db
          _make_legacy_db(Path(r'$data') / 'jobs.db')
          print('legacy db written')
          "@
          if ($LASTEXITCODE -ne 0) { throw "legacy db seed failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "dist\Karrierekrake.exe").Path
          # Require marker db= line to point at this isolated legacy jobs.db.
          & ".\scripts\ci_wait_exe_smoke.ps1" -ExePath $exe -LocalAppData $tmp.FullName -ExpectedDbSubstring $data
          python -c @"
          import sqlite3
          from pathlib import Path
          db = Path(r'$data') / 'jobs.db'
          cols = {r[1] for r in sqlite3.connect(db).execute('PRAGMA table_info(jobs)')}
          assert 'run_id' in cols, cols
          print('legacy migration verified')
          "@
          if ($LASTEXITCODE -ne 0) { throw "legacy migration assert failed" }
          & ".\scripts\ci_wait_exe_smoke.ps1" -ExePath $exe -LocalAppData $tmp.FullName -ExpectedDbSubstring $data
      - name: Packaged reset preserves profile
        shell: pwsh
        run: |
          $tmp = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\jhs-reset-$([guid]::NewGuid())"
          $env:LOCALAPPDATA = $tmp.FullName
          python scripts/ci_packaged_reset_check.py
      - name: Upload EXE + metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Karrierekrake-Windows-Smoke
          path: |
            dist/Karrierekrake-Windows.zip
            dist/Karrierekrake-Windows.zip.json
            dist/Karrierekrake.exe
            dist/build_metadata.txt
            dist/content_manifest.json
            dist/smoke_test_result.txt
            artifacts/cv_import_exe_offline_e2e.json
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## WINDOWS BUILD / EXE
          - build: see job
          - production content gate: see job
          - EXE startup smoke: see job
          - offline CV import E2E: see artifacts/cv_import_exe_offline_e2e.json
          - legacy DB EXE: see job
          - reset: see job
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path artifacts/cv_import_exe_offline_e2e.json) {
            Add-Content $env:GITHUB_STEP_SUMMARY "### Offline CV metrics"
            Get-Content artifacts/cv_import_exe_offline_e2e.json | Add-Content $env:GITHUB_STEP_SUMMARY
          }
