name: Publish native desktop packages
on:
  workflow_run:
    workflows: [Desktop Platforms, Publish component update]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-desktop-release
  cancel-in-progress: false
jobs:
  gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
      run: ${{ steps.gate.outputs.run }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            const repo = {...context.repo};
            const sha = context.payload.workflow_run.head_sha;
            const main = await github.rest.repos.getBranch({...repo, branch: 'main'});
            if (sha !== main.data.commit.sha) return;
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({...repo, head_sha: sha, event: 'push', per_page: 100});
            const native = data.workflow_runs.filter(r => r.name === 'Desktop Platforms' && r.head_branch === 'main').sort((a,b) => b.id-a.id)[0];
            if (!native || native.status !== 'completed' || native.conclusion !== 'success') return;
            for (const name of ['CI', 'Windows Smoke']) {
              const run = data.workflow_runs.filter(r => r.name === name).sort((a,b) => b.id-a.id)[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') return;
            }
            const {data: releases} = await github.rest.repos.listReleases({...repo, per_page: 20});
            const release = releases.find(r => !r.draft && !r.prerelease && r.target_commitish === sha && /^update-\d+-[a-f0-9]{12}$/.test(r.tag_name));
            if (!release) return;
            core.setOutput('publish', 'true'); core.setOutput('sha', sha);
            core.setOutput('run', String(native.id)); core.setOutput('tag', release.tag_name);
  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Retrieve only the trusted main build
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ needs.gate.outputs.run }}
        run: gh run download "$NATIVE_RUN_ID" --repo deadfrogface/Karrierekrake --pattern 'Karrierekrake-*' --dir native-artifacts
      - name: Attach all three tested packages to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          current=$(gh api repos/deadfrogface/Karrierekrake/branches/main --jq '.commit.sha')
          if [ "$current" != "$TARGET_SHA" ]; then exit 0; fi
          python scripts/publish_native_assets.py --artifacts native-artifacts --tag "$RELEASE_TAG" --commit "$TARGET_SHA"
