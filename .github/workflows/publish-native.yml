name: Publish Karrierekrake Alpha
on:
  workflow_run:
    workflows: [Desktop Platforms, Publish component update]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-desktop-release
  cancel-in-progress: false
jobs:
  gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
      run: ${{ steps.gate.outputs.run }}
      windows_run: ${{ steps.gate.outputs.windows_run }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            const repo = {...context.repo};
            const sha = context.payload.workflow_run.head_sha;
            const main = await github.rest.repos.getBranch({...repo, branch: 'main'});
            if (sha !== main.data.commit.sha) return;
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({...repo, head_sha: sha, event: 'push', per_page: 100});
            const native = data.workflow_runs.filter(r => r.name === 'Desktop Platforms' && r.head_branch === 'main').sort((a,b) => b.id-a.id)[0];
            if (!native || native.status !== 'completed' || native.conclusion !== 'success') return;
            for (const name of ['CI', 'Windows Smoke']) {
              const run = data.workflow_runs.filter(r => r.name === name).sort((a,b) => b.id-a.id)[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') return;
            }
            const {data: all} = await github.rest.actions.listWorkflowRunsForRepo({...repo, head_sha: sha, per_page: 100});
            const windows = all.workflow_runs.filter(r => r.name === 'Publish component update' && r.event === 'workflow_run' && r.head_branch === 'main').sort((a,b) => b.id-a.id)[0];
            if (!windows || windows.status !== 'completed' || windows.conclusion !== 'success') return;
            core.setOutput('publish', 'true'); core.setOutput('sha', sha);
            core.setOutput('run', String(native.id)); core.setOutput('windows_run', String(windows.id));
  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Publish one release after all three platforms passed
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ needs.gate.outputs.run }}
          WINDOWS_RUN_ID: ${{ needs.gate.outputs.windows_run }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
        run: python scripts/publish_alpha_release.py --native-run "$NATIVE_RUN_ID" --windows-run "$WINDOWS_RUN_ID" --commit "$TARGET_SHA"
