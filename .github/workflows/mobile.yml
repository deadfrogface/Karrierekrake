name: Mobile CI

on:
  push:
    paths:
      - "mobile/**"
      - "contracts/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "contracts/**"
      - ".github/workflows/mobile.yml"

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
