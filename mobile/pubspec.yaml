name: karrierekrake_mobile
description: >
  Karrierekrake companion MVP for Android/iOS.
  NEW Flutter application — NOT a port of the Windows/PySide desktop client.
  Local-only Drift persistence; sync transport remains UNSPECIFIED.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  collection: ^1.18.0
  meta: ^1.15.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  # AppAuth-compatible session layer uses system browser / ASWebAuthenticationSession.
  # flutter_appauth wraps AppAuth-Android / AppAuth-iOS for device builds.
  flutter_appauth: ^6.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - assets/demo/
